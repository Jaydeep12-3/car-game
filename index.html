<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Open World Driver</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Import Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>


    <!-- MOBILE CONTROLS -->

<div id="mobile-controls">

    <div class="left-controls">
        <button id="left-btn">◀</button>
        <button id="right-btn">▶</button>
    </div>

    <div class="right-controls">
        <button id="brake-btn">▼</button>
        <button id="acc-btn">▲</button>
    </div>

</div>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        
        <div id="settings-panel">
            <label>Car Speed limit: <span id="speed-display">1.5</span></label>
            <input type="range" id="max-speed-slider" min="0.5" max="10.0" step="0.1" value="1.5">
        </div>

        <div class="hud">
            <div class="speedometer">
                <div class="speed-value" id="speed">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
            <div class="controls-hint">
                <p>W / Up : Accelerate</p>
                <p>S / Down : Brake / Reverse</p>
                <p>A / D : Steer</p>
                <p>Space : Handbrake</p>
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading" class="screen">
        <h1>BUILDING WORLD...</h1>
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
